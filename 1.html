position:fixed;top:15%;left:8%;width:84%;text-align:center;color:#ffe8a4;font-weight:800;text-shadow:1px 2px 4px #000;pointer-events:none;z-index:30}
</style></head><body><header>⚔️ 复古英雄合击 <small style="font-size:12px">单机典藏版 3.0</small></header><div class="stats"><span id="who"></span><span id="hp"></span><span id="mp"></span><span id="xp"></span><span id="gold"></span><span id="hero"></span></div><canvas id="game" width="480" height="560"></canvas><div class="actions"><button id="attack">⚔️ 攻击</button><button id="skill">✨ 技能</button><button id="combo">🔥 合击</button><button id="heal">💚 治疗</button></div><div class="menu"><button id="bag">🎒 背包</button><button id="equip">🛡️ 装备</button><button id="maps">🗺️ 地图</button><button id="shop">🏪 商店</button><button id="gm">👑 GM</button></div><div class="menu"><button id="quest">📜 任务</button><button id="guide">📖 指南</button><button id="save">💾 存档</button><button id="reset">🔄 重开</button><button id="sound">🔈 音效关</button></div><div class="note">点击地图走动，靠近怪物后攻击。英雄自动协助，怪物会反击。单机存档保存在当前浏览器。</div><div class="log" id="log">欢迎来到原创复古合击世界。</div><div id="toast"></div><div id="overlay" class="overlay"><div class="dialog" id="dialog"><h2>创建角色</h2><p>主号职业</p><select id="job"><option>战士</option><option>法师</option><option>道士</option></select><p>英雄职业</p><select id="hjob"><option>道士</option><option>战士</option><option>法师</option></select><button class="wide" id="start">开始冒险</button><button class="wide hidden" id="resume">继续存档</button><p class="muted">原创复古像素单机游戏，非官方《热血传奇》客户端。支持离线运行（网页文件已加载后）、本地存档和GM。</p></div></div><script>
(()=>{'use strict';const $=x=>document.getElementById(x),canvas=$('game'),g=canvas.getContext('2d');g.imageSmoothingEnabled=false;const T=32,WIDTH=15,HEIGHT=17,KEY='legend-complete-v3';let s=null,mobs=[],decor=[],fx=[],tick=0,last=0,autoSave=0,noticeTimer=null,muted=true;const maps=['比奇郊外','盟重荒漠','沃玛寺庙','祖玛神殿','赤月峡谷','魔龙山谷'];const monsters=[['稻草人','半兽人','森林狼'],['沙虫','骷髅战士','沙漠蜥蜴'],['沃玛战士','火焰沃玛','沃玛勇士'],['祖玛卫士','祖玛雕像','楔蛾'],['血巨人','月魔蜘蛛','血僵尸'],['魔龙刀兵','魔龙射手','魔龙巨蛾']];const bosses=['半兽人统领','沙漠魔王','沃玛教主','祖玛教主','赤月恶魔','魔龙教主'];const combos={'战士战士':'破魂斩','战士法师':'雷霆一击','战士道士':'劈星斩','法师法师':'火龙气焰','法师道士':'末日审判','道士道士':'噬魂沼泽'};const items=[['木剑','武器',1,5],['乌木剑','武器',3,50],['铁剑','武器',5,100],['炼狱','武器',10,500],['银蛇','武器',14,800],['魔杖','武器',14,800],['裁决之杖','武器',25,4000],['骨玉权杖','武器',25,4000],['龙纹剑','武器',25,4000],['屠龙','武器',45,20000],['布衣','衣服',1,5],['轻型盔甲','衣服',3,150],['战神盔甲','衣服',9,800],['恶魔长袍','衣服',12,900],['幽灵战衣','衣服',12,900],['雷霆战甲','衣服',28,6000],['烈焰魔衣','衣服',28,6000],['光芒道袍','衣服',28,6000],['青铜头盔','头盔',2,150],['黑铁头盔','头盔',7,1300],['铁手镯','手镯',2,150],['金手镯','手镯',5,500],['珊瑚戒指','戒指',4,500],['力量戒指','戒指',12,2200],['太阳水','药水',0,35],['强效太阳水','药水',0,90]];const itemBy=n=>items.find(i=>i[0]===n)||[n,'材料',0,1];const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),distance=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);function msg(t){$('log').textContent=t;$('toast').textContent=t;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('toast').textContent='',1600)}function persist(){if(s)try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){msg('存档失败：浏览器存储不可用')}}function xpNeed(){return 70+s.lv*40}function stats(){if(!s)return;$('who').textContent=s.job+' Lv.'+s.lv+' · '+maps[s.map];$('hp').textContent='❤️ '+s.hp+'/'+s.maxHp;$('mp').textContent='💧 '+s.mp+'/'+s.maxMp;$('xp').textContent='经验 '+s.xp+'/'+xpNeed();$('gold').textContent='💰 '+s.gold;$('hero').textContent='英雄 '+s.hjob+' Lv.'+s.hlv}function modal(title,html){$('overlay').classList.remove('hidden');$('dialog').innerHTML='<h2>'+title+'</h2>'+html+'<button class="wide" id="close">返回游戏</button>';$('close').onclick=close}function close(){$('overlay').classList.add('hidden')}function start(){s={job:$('job').value,hjob:$('hjob').value,lv:1,hlv:1,xp:0,hxp:0,hp:110,maxHp:110,mp:70,maxMp:70,gold:50,map:0,x:7,y:9,kills:0,bossKills:0,rate:1,bag:['木剑','布衣','太阳水','太阳水'],gear:{武器:'木剑',衣服:'布衣',头盔:'无',手镯:'无',戒指:'无'},quest:0,comboAt:0,skillAt:0,steps:0,autoHeal:true};close();generate();stats();persist();msg('冒险开始！先打稻草人和半兽人。')}function generate(){mobs=[];decor=[];let seed=171+s.map*381;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}for(let i=0;i<52;i++){let x=Math.floor(rand()*15),y=Math.floor(rand()*17);if(Math.abs(x-s.x)+Math.abs(y-s.y)<3)continue;decor.push({x,y,t:i%4})}for(let i=0;i<10;i++){let x=Math.floor(rand()*15),y=Math.floor(rand()*17);if(Math.abs(x-s.x)+Math.abs(y-s.y)<4)continue;mobs.push(makeMob(x,y,false,i))}}function makeMob(x,y,boss,i=0){let lvl=1+s.map*6;let max=boss?250+lvl*32:38+lvl*17;return{x,y,boss,name:boss?bosses[s.map]:monsters[s.map][i%3],hp:max,max,atk:boss?12+lvl*2:3+Math.floor(lvl/2),id:Math.random(),next:Date.now()+rnd(1600,3000)}}function fill(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function terrain(){let palettes=[['#324d30','#405b38','#294331'],['#76603c','#856d47','#6b5436'],['#53554d','#646258','#43473e'],['#5d554d','#686056','#4a453f'],['#403d41','#4d454a','#35333a'],['#42463b','#4f5244','#333b35']];let p=palettes[s.map];for(let y=0;y<18;y++)for(let x=0;x<15;x++){let n=(x*11+y*7+x*y*3)%13;fill(x*T,y*T,T,T,p[n%3]);if(n%3===0)fill(x*T+8,y*T+19,4,2,s.map===0?'#67824a':'#8b8066')}for(let d of decor){let x=d.x*T,y=d.y*T;if(s.map===0||s.map===5){if(d.t<3){fill(x+13,y+14,7,17,'#69462d');fill(x+4,y+5,25,17,'#28502f');fill(x+9,y,17,13,'#3a6a3e')}else{fill(x+5,y+18,25,8,'#303d35');fill(x+10,y+11,17,10,'#73776c')}}else if(s.map===1){fill(x+6,y+15,25,10,'#5b4d39');fill(x+10,y+10,17,8,'#b69a6b')}else{fill(x+7,y+8,22,23,'#343b39');fill(x+9,y+4,17,12,'#8c8174')}}}function person(x,y,job,hero=false){let px=x*T+16,py=y*T+18;fill(px-8,py+10,18,4,'#1d291e');fill(px-6,py+3,5,10,'#292831');fill(px+2,py+3,5,10,'#292831');let color=job==='战士'?'#c5a767':job==='法师'?'#547fc2':'#d9d0a9';fill(px-7,py-13,16,18,color);fill(px-6,py-23,13,11,'#e4b88d');fill(px-7,py-25,15,4,job==='道士'?'#e9dcb8':'#4b382b');fill(px-10,py-11,4,14,color);fill(px+9,py-11,4,14,color);fill(px+11,py-19,3,25,hero?'#6ef0df':'#ddd2ad');fill(px+9,py-21,7,5,hero?'#6ef0df':'#ffda70');fill(px-3,py-18,3,2,'#34291f');if(hero){g.strokeStyle='#6fd3d8';g.strokeRect(px-12,py-28,26,43)}}function mobDraw(m){let px=m.x*T+16,py=m.y*T+18,col=m.boss?'#bd4940':s.map===0?'#ad8159':s.map===1?'#b9ab89':s.map===2?'#8d956c':s.map===3?'#ae9267':s.map===4?'#9e5269':'#9c7771';fill(px-9,py+10,20,4,'#242b23');fill(px-9,py-10,19,21,col);fill(px-7,py-19,15,11,col);fill(px-12,py-7,5,15,col);fill(px+9,py-7,5,15,col);fill(px-7,py+9,6,7,'#47352f');fill(px+3,py+9,6,7,'#47352f');fill(px-4,py-14,3,3,'#ffda88');fill(px+4,py-14,3,3,'#ffda88');if(m.boss){fill(px-13,py-24,8,9,'#e8c069');fill(px+6,py-24,8,9,'#e8c069')}fill(px-15,py-32,30,4,'#481e1b');fill(px-15,py-32,30*Math.max(0,m.hp/m.max),4,'#87d86b');g.textAlign='center';g.font='11px sans-serif';g.fillStyle='#f4e3b3';g.fillText(m.name,px,py-35)}function render(now){if(s){terrain();for(let m of mobs)mobDraw(m);person(s.x,s.y,s.job);person(clamp(s.x-1,0,14),clamp(s.y+1,0,16),s.hjob,true);g.fillStyle='#ffe5a5';g.font='bold 12px sans-serif';g.textAlign='left';g.fillText(maps[s.map]+'  '+(s.map+1)+'/6',10,19);for(let f of fx){g.globalAlpha=Math.max(0,f.until-now)/500;g.strokeStyle=f.color;g.lineWidth=3;g.beginPath();g.arc(f.x*T+16,f.y*T+16,30*(1-g.globalAlpha)+4,0,Math.PI*2);g.stroke();g.globalAlpha=1}fx=fx.filter(f=>f.until>now);if(now-last>650){last=now;tick++;logic(now)}if(now-autoSave>15000){autoSave=now;persist()}}requestAnimationFrame(render)}function closest(){let m=null,d=1e9;for(let a of mobs){let v=distance(a,s);if(v<d){m=a;d=v}}return{m,d}}function attackPower(){return 10+s.lv*3+itemBy(s.gear.武器)[2]+Math.floor(s.hlv/3)}function gainXp(n){s.xp+=n;s.hxp+=Math.ceil(n*.7);while(s.xp>=xpNeed()){s.xp-=xpNeed();s.lv++;s.maxHp+=16;s.maxMp+=8;s.hp=s.maxHp;s.mp=s.maxMp;msg('升级成功！主号 Lv.'+s.lv)}while(s.hxp>=50+s.hlv*40){s.hxp-=50+s.hlv*40;s.hlv++}}function hit(m,power,label){m.hp-=power;fx.push({x:m.x,y:m.y,until:performance.now()+450,color:label==='合击'?'#ffad37':'#f5e7b1'});if(m.hp>0){msg(label+'命中 '+m.name+'，伤害 '+power);return}let gold=m.boss?rnd(300,900)+s.map*150:rnd(8,25)+s.map*14;s.gold+=gold;s.kills++;if(m.boss)s.bossKills++;gainXp(m.boss?220+s.map*75:20+s.map*16);let drop='';let chance=(m.boss?.8:.18)*s.rate;if(Math.random()<Math.min(.95,chance)){let pool=items.filter(a=>a[1]!=='药水'&&a[2]<=s.map*7+5+(m.boss?25:0));drop=pool[rnd(0,pool.length-1)][0];s.bag.push(drop)}else if(Math.random()<.28){drop='太阳水';s.bag.push(drop)}msg('击败'+m.name+'，金币+'+gold+(drop?'，掉落【'+drop+'】':''));mobs=mobs.filter(a=>a!==m);if(mobs.length<7)mobs.push(makeMob(rnd(0,14),rnd(1,16),false,rnd(0,8)));stats();persist()}function attack(type){if(!s)return;let {m,d}=closest();if(!m){msg('没有怪物');return}if(d>2){msg('先点击地图靠近怪物');return}let now=Date.now();if(type==='合击'){if(now<s.comboAt){msg('合击冷却 '+Math.ceil((s.comboAt-now)/1000)+' 秒');return}if(s.mp<20){msg('魔法值不足');return}s.mp-=20;s.comboAt=now+9000;hit(m,attackPower()*3+s.hlv*4,'合击');msg('🔥 '+(combos[s.job+s.hjob]||combos[s.hjob+s.job])+'！')}else if(type==='技能'){if(now<s.skillAt){msg('技能冷却中');return}if(s.mp<9){msg('魔法值不足');return}s.mp-=9;s.skillAt=now+2300;let name=s.job==='战士'?'烈火剑法':s.job==='法师'?'雷电术':'灵魂火符';hit(m,attackPower()*2+8,name)}else hit(m,attackPower(),'攻击');stats()}function logic(now){if(!s)return;s.mp=Math.min(s.maxMp,s.mp+1);if(tick%4===0)s.hp=Math.min(s.maxHp,s.hp+1);let {m,d}=closest();if(m&&d<=2&&tick%3===0)hit(m,Math.max(4,4+s.hlv*2),'英雄协助');for(let a of mobs){if(distance(a,s)<=1&&now>a.next){s.hp=Math.max(0,s.hp-a.atk);a.next=now+rnd(1500,2800);if(s.hp===0){s.hp=s.maxHp;s.mp=s.maxMp;s.x=7;s.y=9;s.gold=Math.max(0,s.gold-30);msg('角色倒下，已复活并损失少量金币')}}}stats()}canvas.addEventListener('pointerdown',e=>{if(!s)return;let r=canvas.getBoundingClientRect();s.x=clamp(Math.floor((e.clientX-r.left)/r.width*15),0,14);s.y=clamp(Math.floor((e.clientY-r.top)/r.height*17.5),0,16);s.steps++;if(s.steps%5===0)persist()});function inventory(){modal('🎒 背包 '+s.bag.length+' 件',s.bag.map((n,i)=>'<div class="item">'+n+' <span class="muted">'+itemBy(n)[1]+'</span><button data-i="'+i+'">'+(itemBy(n)[1]==='药水'?'使用':'装备')+'</button></div>').join('')||'背包空空如也');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let i=+b.dataset.i,n=s.bag[i],it=itemBy(n);if(it[1]==='药水'){s.hp=Math.min(s.maxHp,s.hp+(n==='强效太阳水'?120:55));s.mp=Math.min(s.maxMp,s.mp+30);s.bag.splice(i,1);msg('使用 '+n)}else if(it[1]==='材料'){msg('无法装备该物品');return}else{s.gear[it[1]]=n;msg('装备成功：'+n)}persist();stats();inventory()})}function equipment(){modal('🛡️ 人物装备',Object.entries(s.gear).map(([k,v])=>'<div class="item">'+k+'：<span class="good">'+v+'</span>　属性 +'+itemBy(v)[2]+'</div>').join('')+'<p>主号等级：'+s.lv+'　英雄等级：'+s.hlv+'</p><p class="muted">背包中点击装备可替换，装备属性会提高攻击力（武器）或作为收集目标。</p>')}function mapMenu(){modal('🗺️ 世界地图',maps.map((n,i)=>'<button data-map="'+i+'">'+n+'<small> Lv.'+(i*6+1)+'+</small></button>').join('')+'<p class="muted">高等级地图怪物更强。GM可直接传送。</p>');document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{s.map=+b.dataset.map;s.x=7;s.y=9;generate();stats();persist();close();msg('进入 '+maps[s.map])})}function shop(){modal('🏪 杂货商店 · 金币 '+s.gold,items.filter(x=>['药水','武器','衣服'].includes(x[1])&&x[3]<1500).map((it,i)=>'<div class="item">'+it[0]+' · '+it[3]+'金币<button data-buy="'+it[0]+'">购买</button></div>').join(''));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let it=itemBy(b.dataset.buy);if(s.gold<it[3]){msg('金币不足');return}s.gold-=it[3];s.bag.push(it[0]);persist();stats();shop();msg('购买 '+it[0]+' 成功')})}function quest(){let goal=5+s.quest*5,done=s.kills>=goal;modal('📜 悬赏任务','<p>任务 '+(s.quest+1)+'：累计击败 '+goal+' 只怪物</p><p>当前击杀：'+s.kills+' / '+goal+'</p><p>奖励：'+(200+s.quest*250)+'金币、经验 '+(100+s.quest*60)+'</p>'+(done?'<button id="claim">领取奖励</button>':'<p class="muted">继续击败怪物后回来领取。</p>'));if(done)$('claim').onclick=()=>{s.gold+=200+s.quest*250;gainXp(100+s.quest*60);s.quest++;persist();stats();quest();msg('任务奖励已领取')}}function gm(){modal('👑 单机 GM 管理','<p class="muted">仅修改你自己的本地存档。</p><button data-gm="lv">升级 +10</button><button data-gm="gold">金币 +10000</button><button data-gm="boss">召唤BOSS</button><button data-gm="dragon">获得屠龙</button><button data-gm="gear">三职业神装</button><button data-gm="rate">爆率 ×2</button><button data-gm="heal">全恢复</button><button data-gm="hero">英雄升级 +10</button><button data-gm="allmap">传送魔龙</button><p>当前爆率倍率：×'+s.rate+'</p>');document.querySelectorAll('[data-gm]').forEach(b=>b.onclick=()=>{let k=b.dataset.gm;if(k==='lv'){s.lv+=10;s.maxHp+=160;s.maxMp+=80;s.hp=s.maxHp;s.mp=s.maxMp}if(k==='gold')s.gold+=10000;if(k==='boss')mobs.push(makeMob(clamp(s.x+2,0,14),s.y,true));if(k==='dragon')s.bag.push('屠龙');if(k==='gear')s.bag.push('雷霆战甲','烈焰魔衣','光芒道袍','裁决之杖','骨玉权杖','龙纹剑');if(k==='rate')s.rate*=2;if(k==='heal'){s.hp=s.maxHp;s.mp=s.maxMp}if(k==='hero')s.hlv+=10;if(k==='allmap'){s.map=5;generate()}stats();persist();close();msg('GM指令执行成功')})}function reset(){modal('🔄 重新开始','<p class="bad">会删除当前单机存档，无法撤销。</p><button id="confirm">确认删除并重开</button>');$('confirm').onclick=()=>{localStorage.removeItem(KEY);location.reload()}}function guide(){modal('📖 玩法说明','<p>点击地图移动，靠近怪物后点攻击。英雄会自动协助攻击，怪物也会反击。</p><p>战士：烈火剑法；法师：雷电术；道士：灵魂火符。不同主号与英雄组合有六种合击技能。</p><p>背包可穿戴装备或使用药水；商店用金币购买；悬赏任务领取奖励；GM可刷装备和召唤BOSS。</p><p>每15秒自动存档，也可手动存档。不同网址或浏览器的存档不会自动互通。</p><p class="muted">此为原创简化单机游戏，尚不包含联网多人、官方全部地图、交易或完整职业技能树。</p>')}const buttons={attack:()=>attack('攻击'),skill:()=>attack('技能'),combo:()=>attack('合击'),heal:()=>{if(!s)return;s.hp=Math.min(s.maxHp,s.hp+45);s.mp=Math.min(s.maxMp,s.mp+12);stats();msg('生命恢复')},bag:inventory,equip:equipment,maps:mapMenu,shop,gm,quest,guide,save:()=>{persist();msg('已保存进度')},reset,sound:()=>{muted=!muted;$('sound').textContent=muted?'🔈 音效关':'🔊 音效开';msg('此版本暂未加入音频素材')}};Object.keys(buttons).forEach(k=>$(k).onclick=()=>{if(!s&&k!=='sound')return;buttons[k]()});$('start').onclick=start;try{let old=localStorage.getItem(KEY);if(old){$('resume').classList.remove('hidden');$('resume').onclick=()=>{try{s=JSON.parse(old);if(!s||!s.gear||!maps[s.map])throw Error('bad');close();generate();stats();msg('已读取上次存档')}catch(e){msg('存档读取失败，请创建角色')}}}}catch(e){}requestAnimationFrame(render);
})();
