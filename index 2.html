<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#171b16"><title>复古合击传奇 V2.0</title><style>
*{box-sizing:border-box}body{margin:0;background:#11150f;color:#f4dca8;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}header{text-align:center;padding:10px 4px;background:linear-gradient(#49331d,#211b14);font-size:19px;font-weight:800;letter-spacing:2px;border-bottom:2px solid #b68a43}.stats{display:flex;justify-content:space-around;flex-wrap:wrap;gap:4px;background:#24241a;padding:9px 3px;font-size:12px}.bar{height:5px;background:#55342b;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:#d74d45}#game{display:block;width:100%;max-width:600px;aspect-ratio:1/1.12;margin:auto;background:#283923;touch-action:none;image-rendering:pixelated;border:2px solid #695b35}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:7px 5px}.actions button,.menu button,.dialog button{background:#493521;border:1px solid #b88b48;border-radius:9px;color:#f8dba4;padding:12px 2px;font-size:13px;min-height:46px}.actions button:active,.menu button:active{background:#82602f}.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:0 5px 7px}.menu button{background:#292c20;padding:8px 1px;min-height:37px}.hint{padding:4px 10px;color:#a5a88b;font-size:12px}.log{margin:5px 8px 12px;border:1px solid #4e5037;background:#1b211a;border-radius:7px;padding:8px;min-height:42px;font-size:12px;color:#d7cba7}.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:5;padding:18px}.dialog{width:min(100%,440px);max-height:85vh;overflow:auto;background:#282218;border:2px solid #9e8047;border-radius:15px;padding:18px;box-shadow:0 0 40px #000}.dialog h2{margin:0 0 12px;text-align:center}.dialog select{width:100%;padding:13px;margin:6px 0 12px;background:#4b3926;color:#fff0bd;border:1px solid #b18c4d;border-radius:7px;font-size:17px}.dialog button{padding:11px 14px;margin:4px;min-width:75px}.dialog .wide{width:100%;margin:8px 0}.item{border-bottom:1px solid #50412b;padding:9px 0;font-size:14px}.muted{color:#c0b08b;font-size:12px}.hidden{display:none!important}.tag{color:#91d48a}#toast{position:fixed;top:18%;left:10%;width:80%;text-align:center;pointer-events:none;color:#ffe7a5;text-shadow:2px 2px #000;font-weight:bold;z-index:8}
</style></head><body><header>⚔️ 复古合击传奇 <small style="font-size:12px">V2.0</small></header><div class="stats"><span id="who">战士 Lv.1</span><span id="hp">❤️ 100/100</span><span id="xp">经验 0/60</span><span id="gold">💰 0</span><span id="hero">英雄：道士</span></div><canvas id="game" width="480" height="538"></canvas><div class="actions"><button id="attack">⚔️ 攻击</button><button id="combo">🔥 英雄合击</button><button id="heal">💚 治疗</button><button id="gm">👑 GM</button></div><div class="menu"><button id="bag">🎒 背包</button><button id="equip">🛡️ 装备</button><button id="maps">🗺️ 地图</button><button id="save">💾 存档</button></div><div class="hint">点击地图移动，靠近怪物后攻击；英雄自动协助。所有画面为原创像素绘制。</div><div class="log" id="log">欢迎来到玛法风格的冒险世界！</div><div id="toast"></div><div class="overlay" id="overlay"><div class="dialog" id="dialog"><h2>创建角色</h2><p>选择主号与英雄职业</p><select id="job"><option>战士</option><option>法师</option><option>道士</option></select><select id="hjob"><option>道士</option><option>战士</option><option>法师</option></select><button class="wide" id="start">进入复古大陆</button><p class="muted">V2.0：原创像素地图、怪物、装备、合击、GM与本地存档。</p><button class="wide hidden" id="resume">继续上次游戏</button></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const W=480,H=538,T=32;let s=null,monsters=[],trees=[],rocks=[],target=null,steps=0,lastAuto=0;const names=['比奇郊外','盟重荒漠','祖玛神殿','赤月峡谷'];const mobs=[['稻草人','半兽人','森林狼'],['沙虫','骷髅兵','沙漠蜥蜴'],['祖玛卫士','祖玛雕像','楔蛾'],['血巨人','月魔蜘蛛','赤月魔蛛']];const bosses=['半兽人统领','沙漠魔王','祖玛教主','赤月恶魔'];const loot=['乌木剑','青铜头盔','轻型盔甲','铁手镯','魔法长袍','降魔','炼狱','银蛇','裁决之杖','骨玉权杖','龙纹剑','雷霆战甲','烈焰魔衣','光芒道袍','屠龙'];let cooldown=0;const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function message(x){$('log').textContent=x;$('toast').textContent=x;setTimeout(()=>{if($('toast').textContent===x)$('toast').textContent=''},1300)}function persist(){if(s)localStorage.setItem('legend-v2-save',JSON.stringify(s))}function ui(){if(!s)return;$('who').textContent=s.job+' Lv.'+s.lv+' · '+names[s.map];$('hp').textContent='❤️ '+Math.max(0,s.hp)+'/'+s.maxHp;$('xp').textContent='经验 '+s.xp+'/'+(s.lv*60);$('gold').textContent='💰 '+s.gold;$('hero').textContent='英雄：'+s.hjob+' · '+s.kills+'杀'}function modal(title,body){$('overlay').classList.remove('hidden');$('dialog').innerHTML='<h2>'+title+'</h2>'+body+'<button class="wide" id="close">返回游戏</button>';$('close').onclick=()=>$('overlay').classList.add('hidden')}function start(){s={job:$('job').value,hjob:$('hjob').value,lv:1,xp:0,maxHp:100,hp:100,gold:0,kills:0,map:0,x:7,y:9,bag:['木剑','布衣'],gear:{武器:'木剑',衣服:'布衣'},rate:1};$('overlay').classList.add('hidden');generate();ui();persist();message('冒险开始！点击地面移动。')}function generate(){monsters=[];trees=[];rocks=[];let seed=31+s.map*103;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let i=0;i<44;i++){let x=Math.floor(rand()*15),y=Math.floor(rand()*17);if(Math.abs(x-s.x)+Math.abs(y-s.y)<3)continue;(i%3?trees:rocks).push({x,y})}for(let i=0;i<9;i++){let x=Math.floor(rand()*15),y=Math.floor(rand()*16);if(Math.abs(x-s.x)+Math.abs(y-s.y)<4)continue;monsters.push(makeMob(x,y,false,i))}}function makeMob(x,y,boss,i=0){let lvl=s.map*5+1;return{x,y,boss,name:boss?bosses[s.map]:mobs[s.map][i%3],hp:boss?180+lvl*18:28+lvl*12,max:boss?180+lvl*18:28+lvl*12,atk:boss?13+lvl:3+lvl,phase:Math.random()*6}}function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}function pixel(x,y,col,scale=4){rect(x,y,scale,scale,col)}function terrain(){const pal=[['#334a2d','#405734','#263e2b'],['#79633d','#89734b','#685333'],['#55534d','#666159','#44433e'],['#393b38','#454541','#30322f']][s.map];for(let y=0;y<17;y++)for(let x=0;x<15;x++){let n=(x*13+y*7+x*y*3)%11;rect(x*T,y*T,T,T,pal[n%3]);if(n%3===0){rect(x*T+7,y*T+13,3,2,s.map===0?'#657d45':'#99815a');rect(x*T+21,y*T+23,4,2,'#3a3b2c')} }for(let q of trees){let x=q.x*T,y=q.y*T;if(s.map===0){rect(x+12,y+15,8,15,'#65452b');rect(x+3,y+4,26,16,'#234a2c');rect(x+8,y,16,12,'#38643a');rect(x+1,y+11,8,7,'#315c36')}else if(s.map===1){rect(x+8,y+13,18,11,'#6a5236');rect(x+5,y+10,23,6,'#aa8955')}else{rect(x+7,y+8,20,21,'#373b38');rect(x+10,y+3,15,10,'#77726a')}}for(let q of rocks){let x=q.x*T,y=q.y*T;rect(x+5,y+15,24,11,'#343b35');rect(x+9,y+10,16,7,'#77786a');rect(x+5,y+24,24,3,'#252923')}}function actor(x,y,job,hero=false){let px=x*T+16,py=y*T+18;rect(px-8,py+10,17,4,'#1c271b');rect(px-5,py+2,4,10,'#2b2930');rect(px+2,py+2,4,10,'#2b2930');let color=job==='战士'?'#b5a06a':job==='法师'?'#4674ad':'#d0c7a7';rect(px-7,py-13,15,17,color);rect(px-5,py-22,11,10,'#e7b68a');rect(px-6,py-24,13,4,job==='道士'?'#e4d8b4':'#4b3528');rect(px-10,py-11,4,13,color);rect(px+8,py-11,4,13,color);rect(px+10,py-15,3,22,hero?'#a5e5d0':'#b9b8bd');rect(px+9,py-17,5,4,hero?'#7fffd4':'#f1dc80');rect(px-2,py-18,3,2,'#35281f');if(hero){ctx.strokeStyle='#66d8e8';ctx.strokeRect(px-10,py-26,22,41)}}function monster(m){let px=m.x*T+16,py=m.y*T+18;let col=m.boss?'#b34035':s.map===0?'#9c7151':s.map===1?'#b0a184':s.map===2?'#a28b65':'#8b3c58';rect(px-9,py+9,20,4,'#252b23');rect(px-8,py-10,17,20,col);rect(px-6,py-18,13,11,col);rect(px-10,py-6,5,13,col);rect(px+7,py-6,5,13,col);rect(px-6,py+9,5,7,'#40352f');rect(px+2,py+9,5,7,'#40352f');rect(px-4,py-13,3,3,'#eecb78');rect(px+3,py-13,3,3,'#eecb78');if(m.boss){rect(px-11,py-22,7,8,'#e4b85b');rect(px+5,py-22,7,8,'#e4b85b')}rect(px-13,py-30,26,4,'#3b1615');rect(px-13,py-30,26*Math.max(0,m.hp/m.max),4,'#8bdb69');ctx.fillStyle='#f7e6b9';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(m.name,px,py-34)}function draw(){if(!s)return;terrain();monsters.forEach(monster);actor(s.x,s.y,s.job);let hx=clamp(s.x-1,0,14),hy=clamp(s.y+1,0,16);actor(hx,hy,s.hjob,true);ctx.fillStyle='#f5e1a7';ctx.font='bold 12px sans-serif';ctx.textAlign='left';ctx.fillText(names[s.map]+'  ·  '+(s.map+1)+'/4',9,19);requestAnimationFrame(draw)}function nearest(){let best=null,dist=1e9;for(let m of monsters){let d=Math.abs(m.x-s.x)+Math.abs(m.y-s.y);if(d<dist){dist=d;best=m}}return{m:best,d:dist}}function damage(m,n){if(!m)return;m.hp-=n;if(m.hp<=0){let reward=m.boss?220+s.map*80:12+s.map*9;s.gold+=reward;s.xp+=m.boss?90:20+s.map*10;s.kills++;let drop=Math.random()<Math.min(.85,(m.boss?.85:.17)*s.rate);let item='';if(drop){let pool=m.boss?loot.slice(6):loot.slice(0,Math.min(loot.length,5+s.map*3));item=pool[rnd(0,pool.length-1)];s.bag.push(item)}message('击败'+m.name+'，金币+'+reward+(item?'，获得【'+item+'】':''));monsters=monsters.filter(x=>x!==m);if(s.xp>=s.lv*60){s.xp-=s.lv*60;s.lv++;s.maxHp+=15;s.hp=s.maxHp;message('恭喜升级！当前 Lv.'+s.lv)}if(monsters.length<5)monsters.push(makeMob(rnd(0,14),rnd(0,16),false,rnd(0,8)));persist()}ui()}function attack(combo=false){let {m,d}=nearest();if(!m){message('附近没有怪物');return}if(d>2){message('距离太远，先靠近怪物');return}if(combo&&Date.now()<cooldown){message('合击冷却中');return}let power=(combo?48:14)+s.lv*3+(s.gear.武器==='木剑'?0:9);damage(m,power);if(combo){cooldown=Date.now()+7000;message('🔥 '+s.job+'＋'+s.hjob+' 合击爆发！')}if(m.hp>0){s.hp=Math.max(0,s.hp-m.atk);if(s.hp===0){s.hp=s.maxHp;s.x=7;s.y=9;message('你被击倒，已在安全位置复活')}}ui()}function step(x,y){s.x=clamp(x,0,14);s.y=clamp(y,1,16);steps++;if(steps%3===0){let{m,d}=nearest();if(m&&d<=2)damage(m,6+s.lv*2)}if(steps%7===0){s.hp=Math.max(1,s.hp-2)}ui();if(steps%5===0)persist()}c.addEventListener('pointerdown',e=>{if(!s)return;let r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*480/32),y=Math.floor((e.clientY-r.top)/r.height*538/32);step(x,y)});$('attack').onclick=()=>s&&attack();$('combo').onclick=()=>s&&attack(true);$('heal').onclick=()=>{if(!s)return;s.hp=Math.min(s.maxHp,s.hp+35+s.lv*2);ui();message('生命恢复');persist()};$('save').onclick=()=>{persist();message('存档已保存到此浏览器')};$('bag').onclick=()=>{if(!s)return;modal('🎒 背包 · '+s.bag.length+'件',s.bag.map((v,i)=>'<div class="item">'+v+' <button data-item="'+i+'">装备</button></div>').join('')||'背包空空如也');document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{let v=s.bag[+b.dataset.item],slot=/甲|衣|袍/.test(v)?'衣服':'武器';s.gear[slot]=v;persist();modal('装备成功','已装备 '+v);ui()})};$('equip').onclick=()=>s&&modal('🛡️ 人物装备','<div class="item">武器：'+s.gear.武器+'</div><div class="item">衣服：'+s.gear.衣服+'</div><p class="muted">打开背包可更换装备。</p>');$('maps').onclick=()=>{if(!s)return;modal('🗺️ 选择地图',names.map((n,i)=>'<button data-map="'+i+'">'+n+'</button>').join(''));document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{s.map=+b.dataset.map;s.x=7;s.y=9;generate();ui();persist();$('overlay').classList.add('hidden');message('进入'+names[s.map])})};$('gm').onclick=()=>{if(!s)return;modal('👑 GM 管理菜单','<p class="muted">单机专属，不影响其他玩家。</p><button data-gm="level">升级 +10</button><button data-gm="money">金币 +10000</button><button data-gm="boss">召唤 BOSS</button><button data-gm="item">获得屠龙</button><button data-gm="rate">爆率 ×2</button><button data-gm="heal">恢复生命</button>');document.querySelectorAll('[data-gm]').forEach(b=>b.onclick=()=>{let k=b.dataset.gm;if(k==='level'){s.lv+=10;s.maxHp+=150;s.hp=s.maxHp}if(k==='money')s.gold+=10000;if(k==='boss')monsters.push(makeMob(clamp(s.x+2,0,14),s.y,true));if(k==='item')s.bag.push('屠龙');if(k==='rate')s.rate*=2;if(k==='heal')s.hp=s.maxHp;ui();persist();$('overlay').classList.add('hidden');message('GM指令成功：'+({level:'等级+10',money:'金币+10000',boss:'BOSS已出现',item:'屠龙进入背包',rate:'爆率已提高',heal:'生命恢复'}[k]))})};$('start').onclick=start;let old=localStorage.getItem('legend-v2-save');if(old){$('resume').classList.remove('hidden');$('resume').onclick=()=>{try{s=JSON.parse(old);if(!s||!s.gear)throw Error();$('overlay').classList.add('hidden');generate();ui();draw();message('欢迎回来，已读取存档')}catch(e){message('存档读取失败，请创建角色')}}}const originalStart=$('start').onclick;$('start').onclick=()=>{originalStart();draw()};})();
</script></body></html>
