<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>复古合击·单机版</title><style>body{margin:0;background:#10130f;color:#eed6a2;font-family:-apple-system,Arial}header{padding:10px;text-align:center;background:#292216;font-weight:bold}#hud{padding:8px;font-size:13px;display:flex;justify-content:space-around;background:#211d16}canvas{display:block;width:100vw;height:min(65vh,570px);background:#29452b;touch-action:none}#controls{padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}button,select{background:#483523;color:#ffe5aa;border:1px solid #9c7a45;border-radius:8px;padding:12px 3px;font-size:14px}#log{padding:8px;font-size:12px;height:45px;overflow:auto}#setup{position:fixed;inset:0;background:#10130ff2;display:flex;align-items:center;justify-content:center;z-index:2}#panel{padding:22px;background:#292216;border:1px solid #9c7a45;border-radius:12px;width:80%;max-width:340px;text-align:center}#panel select,#panel button{width:100%;margin:6px 0}</style></head><body><header>⚔️ 复古合击 · 单机体验版</header><div id="hud"><span id="stats"></span><span id="hero"></span></div><canvas id="game"></canvas><div id="controls"><button id="attack">普通攻击</button><button id="skill">英雄合击</button><button id="heal">治疗</button><button id="gm">GM菜单</button></div><div id="log">点击地图移动，靠近怪物后点击攻击。</div><div id="setup"><div id="panel"><h2>创建角色</h2><p>选择主号与英雄职业</p><select id="pc"><option>战士</option><option>法师</option><option>道士</option></select><select id="hc"><option>道士</option><option>战士</option><option>法师</option></select><button id="start">进入玛法大陆</button></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,player={x:110,y:180,hp:100,max:100,lv:1,exp:0,gold:0,atk:14},hero={x:80,y:200,hp:80},mobs=[],target=null,started=false,lastHero=0,inventory=0;const $=id=>document.getElementById(id);function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=Math.min(innerHeight*.65,570)*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W/=devicePixelRatio;H/=devicePixelRatio}addEventListener('resize',resize);resize();function log(t){$('log').textContent=t}function spawn(boss=false){mobs.push({x:35+Math.random()*(W-70),y:45+Math.random()*(H-90),hp:boss?350:40,max:boss?350:40,boss,name:boss?'祖玛教主':'半兽人'})}function refresh(){while(mobs.filter(m=>!m.boss).length<5)spawn()}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function hit(m,d){m.hp-=d;if(m.hp<=0){mobs.splice(mobs.indexOf(m),1);player.exp+=m.boss?120:15;player.gold+=m.boss?200:8;if(Math.random()<(m.boss?.9:.16)){inventory++;log('击败'+m.name+'！获得装备，背包装备 '+inventory+' 件')}else log('击败'+m.name+'，获得金币和经验');if(player.exp>=player.lv*40){player.exp=0;player.lv++;player.max+=12;player.hp=player.max;player.atk+=4;log('升级！当前等级 '+player.lv)}refresh()}}function nearest(){return mobs.reduce((a,b)=>!a||dist(player,b)<dist(player,a)?b:a,null)}function attack(mult=1){let m=nearest();if(!m)return;if(dist(player,m)>95){log('距离太远，先点击怪物附近移动');return}hit(m,Math.floor(player.atk*mult));update()}function update(){$('stats').textContent=`${$('pc').value} Lv.${player.lv} ❤️${player.hp}/${player.max} 💰${player.gold}`;$('hero').textContent=`英雄：${$('hc').value} · 装备${inventory}`}$('start').onclick=()=>{started=true;$('setup').style.display='none';for(let i=0;i<5;i++)spawn();update();requestAnimationFrame(draw)};canvas.addEventListener('pointerdown',e=>{if(!started)return;let r=canvas.getBoundingClientRect();player.x=Math.max(15,Math.min(W-15,e.clientX-r.left));player.y=Math.max(25,Math.min(H-15,e.clientY-r.top));hero.x=player.x-24;hero.y=player.y+18});$('attack').onclick=()=>attack();$('skill').onclick=()=>{let m=nearest();if(!m)return;let names={'战士战士':'破魂斩','战士法师':'雷霆一击','战士道士':'劈星斩','法师法师':'火龙气焰','法师道士':'末日审判','道士道士':'噬魂沼泽'};if(dist(player,m)>130){log('合击距离太远');return}let n=names[[ $('pc').value,$('hc').value].sort().join('')]||'英雄合击';hit(m,player.atk*5);log('释放 '+n+'！');update()};$('heal').onclick=()=>{player.hp=Math.min(player.max,player.hp+35);log('恢复35点生命');update()};$('gm').onclick=()=>{let n=prompt('GM指令：\n1 = 升10级\n2 = 刷装备\n3 = 召唤祖玛教主\n4 = 加1000金币');if(n==='1'){player.lv+=10;player.max+=120;player.hp=player.max;player.atk+=40}else if(n==='2')inventory+=10;else if(n==='3')spawn(true);else if(n==='4')player.gold+=1000;log('GM指令已执行');update()};function draw(t){if(!started)return;ctx.fillStyle='#304b2e';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#49653c';for(let x=0;x<W;x+=40){for(let y=0;y<H;y+=40){ctx.strokeRect(x,y,40,40)}}ctx.textAlign='center';ctx.font='12px Arial';for(const m of mobs){ctx.fillStyle=m.boss?'#aa3b25':'#bd8060';ctx.beginPath();ctx.arc(m.x,m.y,m.boss?18:12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff1ce';ctx.fillText(m.name,m.x,m.y-22);ctx.fillStyle='#9b2929';ctx.fillRect(m.x-19,m.y-18,38,4);ctx.fillStyle='#70d65e';ctx.fillRect(m.x-19,m.y-18,38*Math.max(0,m.hp/m.max),4)}ctx.fillStyle='#6cafff';ctx.beginPath();ctx.arc(hero.x,hero.y,11,0,7);ctx.fill();ctx.fillStyle='white';ctx.fillText('英雄',hero.x,hero.y-16);ctx.fillStyle='#f2d55e';ctx.beginPath();ctx.arc(player.x,player.y,13,0,7);ctx.fill();ctx.fillStyle='white';ctx.fillText('主号',player.x,player.y-18);if(t-lastHero>1800){let m=nearest();if(m&&dist(hero,m)<115){hit(m,Math.max(5,Math.floor(player.atk*.65)));update()}lastHero=t}requestAnimationFrame(draw)}
</script></body></html>
